<!doctype html>
<html lang="es">
<head>
<!--
THESIS: Un instrumento reactivo a la voz, no un formulario: toda la pantalla
es un solo círculo con el que hablas, sin las convenciones de card/chat-widget.
OWN-WORLD: fondo casi negro con tinte cálido, un único acento ámbar apagado,
un anillo de barras de audio en vivo como único "ícono"; el texto en pantalla
es la única marca ("Pedidos").
STORY: el visitante ve un círculo, lo toca, ve/oye al agente escuchar y
responder mediante barras reactivas al audio real, y lo vuelve a tocar o
espera a que el agente se despida solo para colgar.
FIRST VIEWPORT: columna centrada a pantalla completa sobre fondo plano
oscuro — etiqueta "PEDIDOS" diminuta arriba, el círculo-instrumento al centro
(~45% del viewport, máx 232px), una línea de estado debajo, nada más.
FORM: pedido acotado y precisado por el usuario (oscuro, sin neón, onda tipo
LiveKit, solo "Demo") — se construyó directo, sin torneo de conceptos.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, and DESIGN.md.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>Brasa &amp; Pan — Pedidos por llamada</title>
<meta name="description" content="Pide en Brasa &amp; Pan hablando con la asistente, directo desde el navegador y sin necesidad de teléfono." />
<meta property="og:title" content="Brasa &amp; Pan — Pedidos por llamada" />
<meta property="og:description" content="Pide en Brasa &amp; Pan hablando con la asistente, directo desde el navegador y sin necesidad de teléfono." />
<meta property="og:type" content="website" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0c;
    --circulo: #16161a;
    --circulo-borde: rgba(255, 255, 255, 0.08);
    --ink: #f2efe9;
    --ink-tenue: #938d84;
    --ink-debil: #514c46;
    --acento: #c98a4a;
    --acento-suave: rgba(201, 138, 74, 0.4);
    --error: #b56a55;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 6vh, 48px);
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 24px)
      env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 24px);
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--acento); color: #0a0a0c; }

  :focus-visible {
    outline: 2px solid var(--acento);
    outline-offset: 4px;
    border-radius: 4px;
  }

  .marca {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-debil);
  }

  .instrumento {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 4vh, 28px);
  }

  .boton-llamar {
    position: relative;
    width: clamp(176px, 44vw, 232px);
    height: clamp(176px, 44vw, 232px);
    border-radius: 50%;
    border: 1px solid var(--circulo-borde);
    background:
      radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.05), transparent 60%),
      var(--circulo);
    box-shadow: 0 24px 60px -18px rgba(0, 0, 0, 0.65);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
  }

  .boton-llamar::before {
    content: "";
    position: absolute;
    inset: -9px;
    border-radius: 50%;
    border: 1.5px solid var(--acento-suave);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .boton-llamar.en-llamada::before { opacity: 1; }

  .boton-llamar.conectando::before {
    opacity: 1;
    border-style: dashed;
    animation: girar 2.4s linear infinite;
  }

  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  .boton-llamar:hover { transform: scale(1.03); }
  .boton-llamar:active { transform: scale(0.97); }
  .boton-llamar:disabled { cursor: wait; }

  .barras {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(5px, 1.4vw, 7px);
    height: 40%;
    pointer-events: none;
  }

  .barra {
    width: clamp(5px, 1.4vw, 7px);
    border-radius: 999px;
    background: var(--ink-debil);
    height: 14%;
    will-change: height, background-color;
  }

  .estado {
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-tenue);
    text-align: center;
    min-height: 20px;
    transition: color 0.3s ease;
  }

  .estado.error { color: var(--error); }

  .ayuda {
    font-size: 11px;
    color: var(--ink-debil);
    text-align: center;
    max-width: 260px;
    line-height: 1.5;
  }

  /* El bloque de respaldo: cuando la llamada no puede terminar en pedido, lo
     unico que importa es que el cliente encuentre el WhatsApp. Por eso el
     enlace es un boton de verdad y no una linea de texto mas. */
  .respaldo {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 300px;
    text-align: center;
  }

  .respaldo.visible { display: flex; }

  .respaldo p {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-tenue);
  }

  .respaldo strong { color: var(--ink); font-weight: 600; }

  .respaldo a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 20px;
    border-radius: 999px;
    background: #25d366;
    color: #06281a;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }

  .boton-llamar:disabled { opacity: 0.35; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    .boton-llamar, .barra { transition: none; }
    .boton-llamar.conectando::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="marca">Brasa &amp; Pan</div>

  <div class="instrumento">
    <button id="botonLlamar" class="boton-llamar" aria-label="Llamar" type="button">
      <div class="barras" aria-hidden="true">
        <span class="barra"></span>
        <span class="barra"></span>
        <span class="barra"></span>
        <span class="barra"></span>
        <span class="barra"></span>
        <span class="barra"></span>
        <span class="barra"></span>
      </div>
    </button>

    <div id="estado" class="estado">Toca para hablar</div>
  </div>

  <p id="ayuda" class="ayuda">Se te pedirá acceso al micrófono.</p>

  <div id="respaldo" class="respaldo">
    <p id="respaldoTexto"></p>
    <a id="respaldoEnlace" href="#" target="_blank" rel="noopener">Escribir por WhatsApp</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <script>
    const boton = document.getElementById("botonLlamar");
    const estadoEl = document.getElementById("estado");
    const ayudaEl = document.getElementById("ayuda");
    const barraEls = Array.from(document.querySelectorAll(".barra"));

    const COLOR_TENUE = [81, 76, 70];   // --ink-debil, reposo
    const COLOR_TU = [242, 239, 233];   // --ink, cuando tú hablas
    const COLOR_AGENTE = [201, 138, 74]; // --acento, cuando el agente habla

    const respaldoEl = document.getElementById("respaldo");
    const respaldoTextoEl = document.getElementById("respaldoTexto");
    const respaldoEnlaceEl = document.getElementById("respaldoEnlace");

    // Plazo para TODO el arranque de la llamada: pedir el token, conectar por
    // WebRTC y que el agente entre a la sala.
    //
    // Es un solo plazo y no uno por paso a propósito, porque los dos fallos que
    // importan se ven igual desde acá —la pantalla congelada en "Conectando…"—
    // y ninguno de los dos lanza un error que se pueda atrapar:
    //
    //  - Si LIVEKIT_URL apunta a un servidor que no existe, room.connect()
    //    reintenta por su cuenta y tarda mucho en rendirse.
    //  - Si el AGENT_NAME de web/main.py y el de agent.py no coinciden, LiveKit
    //    conecta perfecto y no despacha a nadie: la sala queda vacía.
    //
    // 12 segundos ya son muchos mirando un círculo en silencio; más que eso, el
    // cliente ya se fue.
    const ESPERA_LLAMADA_MS = 12000;

    let room = null;
    let modo = "idle"; // idle | conectando | llamada
    let whatsapp = "";
    let temporizadorAgente = null;
    let audioCtx = null;
    let obtenerNivelLocal = null;
    let obtenerNivelRemoto = null;
    let yaLlamo = false;

    // Estado suavizado por barra, para que el movimiento se vea organico y
    // no salte con cada frame de datos crudos del analizador.
    const alturas = new Array(barraEls.length).fill(0.14);
    const colores = barraEls.map(() => [...COLOR_TENUE]);
    const FASE = [0, 0.9, 1.7, 2.6, 3.4, 4.3, 5.1];
    const VELOCIDAD = [1.3, 1.7, 1.1, 1.9, 1.4, 1.6, 1.2];

    function setEstado(texto, clase) {
      estadoEl.textContent = texto;
      estadoEl.className = "estado" + (clase ? " " + clase : "");
    }

    function mezclarColor(a, b, t) {
      return [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t));
    }

    function crearAnalizador(mediaStreamTrack) {
      const stream = new MediaStream([mediaStreamTrack]);
      const fuente = audioCtx.createMediaStreamSource(stream);
      const analizador = audioCtx.createAnalyser();
      analizador.fftSize = 256;
      analizador.smoothingTimeConstant = 0.7;
      fuente.connect(analizador);
      const datos = new Uint8Array(analizador.frequencyBinCount);
      return () => {
        analizador.getByteFrequencyData(datos);
        let suma = 0;
        for (let i = 0; i < datos.length; i++) suma += datos[i];
        return suma / datos.length / 255;
      };
    }

    function circuloPx() {
      return boton.getBoundingClientRect().height;
    }

    function dibujarFrame(t) {
      const size = circuloPx();
      const base = size * 0.08;
      const extra = size * 0.32;
      const segundos = t / 1000;

      const nivelLocal = modo === "llamada" && obtenerNivelLocal ? obtenerNivelLocal() : 0;
      const nivelRemoto = modo === "llamada" && obtenerNivelRemoto ? obtenerNivelRemoto() : 0;
      const hablaAgente = nivelRemoto > nivelLocal;
      const nivelDominante = Math.max(nivelLocal, nivelRemoto);

      for (let i = 0; i < barraEls.length; i++) {
        const onda = 0.55 + 0.45 * Math.sin(segundos * VELOCIDAD[i] + FASE[i]);
        let objetivoAltura;
        let colorObjetivo;

        if (modo === "llamada" && nivelDominante > 0.03) {
          objetivoAltura = 0.14 + Math.min(nivelDominante * 2.4, 1) * onda;
          colorObjetivo = hablaAgente ? COLOR_AGENTE : COLOR_TU;
        } else {
          // Reposo: respiracion suave y lenta, para que el circulo se sienta
          // vivo antes de la primera llamada y entre llamadas.
          objetivoAltura = 0.1 + 0.05 * (0.5 + 0.5 * Math.sin(segundos * 0.6 + FASE[i]));
          colorObjetivo = COLOR_TENUE;
        }

        alturas[i] += (objetivoAltura - alturas[i]) * 0.18;
        colores[i] = mezclarColor(colores[i], colorObjetivo, 0.12);

        const px = base + alturas[i] * extra;
        barraEls[i].style.height = px + "px";
        barraEls[i].style.background = `rgb(${colores[i][0]}, ${colores[i][1]}, ${colores[i][2]})`;
      }

      requestAnimationFrame(dibujarFrame);
    }
    requestAnimationFrame(dibujarFrame);

    function attachTrack(track) {
      const el = track.attach();
      el.dataset.lkAudio = "1";
      document.body.appendChild(el);
    }

    function limpiarAudios() {
      document.querySelectorAll("audio[data-lk-audio]").forEach((el) => el.remove());
    }

    function pistaLocalDeAudio(room) {
      const publicaciones = room.localParticipant.trackPublications || room.localParticipant.tracks;
      for (const pub of publicaciones.values()) {
        if (pub.kind === "audio" && pub.track) return pub.track;
      }
      return null;
    }

    function mostrarRespaldo(texto) {
      respaldoTextoEl.innerHTML = texto;
      const numero = (whatsapp || "").replace(/\D/g, "");
      if (numero) {
        respaldoEnlaceEl.href = "https://wa.me/" + numero;
        respaldoEnlaceEl.style.display = "";
      } else {
        respaldoEnlaceEl.style.display = "none";
      }
      respaldoEl.classList.add("visible");
      ayudaEl.style.display = "none";
    }

    function ocultarRespaldo() {
      respaldoEl.classList.remove("visible");
    }

    /**
     * Antes de dejar llamar, se pregunta si el sistema de pedidos esta arriba.
     *
     * Es el respaldo mas temprano y el mas valioso: mejor no dejar entrar a una
     * llamada de cuatro minutos que no puede terminar en un pedido, que dejar
     * al cliente contarle todo a una asistente que no va a poder guardarlo.
     */
    async function comprobarServicio() {
      try {
        const resp = await fetch("/api/estado");
        const datos = await resp.json();
        whatsapp = datos.whatsapp || "";
        if (datos.ok === true) return true;
      } catch (err) {
        console.error(err);
      }

      // Si el cliente ya dio clic mientras esto viajaba, su llamada manda.
      //
      // Visto en una prueba real: el chequeo tardó más que el clic, volvió
      // "caído", y la página mostró "Fuera de servicio" y deshabilitó el botón
      // **mientras la asistente ya estaba hablando**. Un veredicto viejo no
      // puede tumbar una llamada en curso, y además una llamada conectada ya
      // demuestra que el sistema está arriba: el agente no habría podido
      // arrancar sin traer el catálogo.
      if (modo !== "idle") return true;

      boton.disabled = true;
      setEstado("Fuera de servicio", "error");
      mostrarRespaldo(
        "<strong>El pedido por llamada está fuera de servicio en este momento.</strong> " +
          "Escríbenos por WhatsApp y te atendemos ahí mismo.",
      );
      return false;
    }

    function cancelarPlazo() {
      if (temporizadorAgente) {
        clearTimeout(temporizadorAgente);
        temporizadorAgente = null;
      }
    }

    function caerAlRespaldo(mensaje) {
      modo = "idle";
      cancelarPlazo();
      if (room) {
        try { room.disconnect(); } catch (_) {}
        room = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch (_) {}
        audioCtx = null;
      }
      limpiarAudios();
      boton.classList.remove("conectando", "en-llamada");
      boton.disabled = false;
      setEstado(mensaje, "error");
      mostrarRespaldo(
        "No pudimos conectarte con la asistente. <strong>Escríbenos por WhatsApp</strong> " +
          "y te tomamos el pedido ahí mismo.",
      );
    }

    async function iniciarLlamada() {
      ocultarRespaldo();
      boton.disabled = true;
      modo = "conectando";
      boton.classList.add("conectando");
      setEstado("Conectando…");

      // El reloj arranca ACÁ, no después de conectar: si connect() se cuelga,
      // un temporizador puesto más abajo nunca llegaría a existir.
      temporizadorAgente = setTimeout(() => {
        caerAlRespaldo("La asistente no contestó.");
      }, ESPERA_LLAMADA_MS);

      try {
        const resp = await fetch("/api/token");
        if (!resp.ok) throw new Error("token");
        const { serverUrl, participantToken } = await resp.json();

        const LK = LivekitClient;
        room = new LK.Room();
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        room.on(LK.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind !== "audio") return;
          attachTrack(track);
          obtenerNivelRemoto = crearAnalizador(track.mediaStreamTrack);
        });

        // La sala es de un cliente + el agente: si el otro participante se
        // va (incluido cuando el bot cuelga solo tras la despedida, ver
        // tools/call.py), la llamada termino para nosotros tambien.
        room.on(LK.RoomEvent.ParticipantDisconnected, () => {
          if (modo === "llamada") terminarLlamada();
        });

        room.on(LK.RoomEvent.Disconnected, () => {
          if (modo === "llamada") terminarLlamada();
        });

        // El agente ENTRANDO a la sala es lo único que confirma que la llamada
        // existe de verdad; conectarse no alcanza. Es lo que apaga el reloj.
        room.on(LK.RoomEvent.ParticipantConnected, cancelarPlazo);

        await room.connect(serverUrl, participantToken);
        await room.localParticipant.setMicrophoneEnabled(true);

        // Puede que ya estuviera adentro antes de suscribirnos al evento.
        if (room.remoteParticipants && room.remoteParticipants.size > 0) {
          cancelarPlazo();
        }

        const pistaLocal = pistaLocalDeAudio(room);
        if (pistaLocal) obtenerNivelLocal = crearAnalizador(pistaLocal.mediaStreamTrack);

        modo = "llamada";
        yaLlamo = true;
        boton.classList.remove("conectando");
        boton.classList.add("en-llamada");
        boton.setAttribute("aria-label", "Colgar");
        boton.disabled = false;
        ayudaEl.style.display = "none";
        setEstado("En llamada — habla cuando quieras");
      } catch (err) {
        // Token, WebRTC o micrófono: desde el lado del cliente son el mismo
        // problema —no hay llamada— y la salida útil es la misma. Decir solo
        // "intenta de nuevo" deja al cliente reintentando algo que no va a
        // funcionar, en vez de mandarlo a donde sí lo atienden.
        console.error(err);
        caerAlRespaldo("No se pudo conectar.");
      }
    }

    async function terminarLlamada() {
      modo = "idle";
      boton.disabled = true;
      cancelarPlazo();
      obtenerNivelLocal = null;
      obtenerNivelRemoto = null;

      if (room) {
        try { await room.disconnect(); } catch (_) {}
        room = null;
      }
      if (audioCtx) {
        try { await audioCtx.close(); } catch (_) {}
        audioCtx = null;
      }
      limpiarAudios();

      boton.classList.remove("en-llamada", "conectando");
      boton.setAttribute("aria-label", "Llamar");
      boton.disabled = false;
      ayudaEl.style.display = "";
      setEstado(yaLlamo ? "Toca para volver a llamar" : "Toca para hablar");
    }

    boton.addEventListener("click", () => {
      if (modo === "llamada") {
        terminarLlamada();
      } else if (modo === "idle") {
        iniciarLlamada();
      }
    });

    comprobarServicio();
  </script>
</body>
</html>
